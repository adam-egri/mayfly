<!DOCTYPE html>
<html>
  <meta charset="utf-8">

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <link rel="stylesheet" href="style.css">
  </head>

  <script>
    fetch("data/date.txt")
    .then(response => response.text())
    .then(text => {
	// find line starting with "month:"
	const match_month = text.match(/^month:\s*(\w+)/mi);	
	if (match_month) {
	    const month = match_month[1];
	    document.getElementById("month").textContent = month;
	}
	const match_day = text.match(/^day:\s*(\w+)/mi);	
	if (match_day) {
	    const day = match_day[1];
	    document.getElementById("day").textContent = day;
	}
	const match_refreshdate = text.match(/\d{4}-\d{2}-\d{2} \d{2}:\d{2}/);
	if (match_refreshdate) {
	    const refreshdate = "Frissítve: "+match_refreshdate;
	    console.log(refreshdate);
	    document.getElementById("refreshdate").textContent = refreshdate;
	}
	const match_refreshyear = text.match(/\d{4}/);
	if (match_refreshyear) {
	    const refreshyear = match_refreshyear;
	    document.getElementById("refreshyear").textContent = refreshyear;
	}

    });
  </script>
  
  <body>

      <li><a href="https://dome.ecolres.hu"><img src="images/DOME-Color_White_Background@4x_cropped.png" style="height:19px;"></a></li>
      <li><a href="https://ecolres.hu"><img src="images/OK-logo.png" style="height:19px;"></a></li>
    </ul>

    <!-- <div id="menu"></div> -->

    <div class="maintext">Becsült<br>rajzási<br>csúcs<br><br>Budapest</div>
    
    <div class="year" id="refreshyear"></div>
    <div class="month" id="month"></div>
    <div class="day" id="day"></div>
    
    <div class="bottomright">Fotó: Potyó Imre</div>
    <div class="bottomleft" id="refreshdate">Frissítve: </div>
